spring.application.name=books-api
server.port=${PORT:8080}

# Conexión a PostgreSQL mediante variables de entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biblioteca_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate crea y actualiza automáticamente la tabla en PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true